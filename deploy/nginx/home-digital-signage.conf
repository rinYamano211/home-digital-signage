# Issue #12, technology-stack 26.6. Install to /etc/nginx/sites-available/
# and link from sites-enabled/. Disable the Debian default site.
server {
    # Loopback only. Not published to the LAN.
    listen 127.0.0.1:80 default_server;
    server_name _;

    root /opt/home-digital-signage/current/dist/frontend;
    index index.html;

    # Do not keep an old screen after a Deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # No URI on proxy_pass: the /api/... path is passed as is.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }
}
